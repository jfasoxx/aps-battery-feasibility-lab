name: Validate battery lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install scientific and notebook dependencies
        run: python -m pip install -r requirements-reproducible.txt
      - name: Test physics, data contracts and finance
        run: python -m unittest -v
      - name: Run synthetic demo
        run: python lab.py --out /tmp/aps-demo
      - name: Independently audit exported results
        run: python verify_results.py /tmp/aps-demo
      - name: Reproduce measured AZPS study
        run: python run_study.py
      - name: Execute reviewer notebook
        run: python -m jupyter nbconvert --execute --to notebook --output /tmp/aps-review.ipynb notebooks/APS_Battery_Review.ipynb
